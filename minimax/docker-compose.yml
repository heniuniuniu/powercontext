services:
  seekdb:
    image: oceanbase/seekdb:latest
    container_name: sdd-seekdb
    ports:
      - "2881:2881"
    environment:
      - MODE=mini
      - OB_ROOT_PASSWORD=
    command: >
      sh -c "mkdir -p /var/lib/oceanbase && /opt/oceanbase/bin/observer --mode mini"
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P2881 -uroot -e 'CREATE DATABASE IF NOT EXISTS sdd' || exit 1"]
      interval: 10s
      retries: 12
