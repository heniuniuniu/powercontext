app:
  description: 办公室离谱辩论会。Dify Workflow 承担输入、主持人串词与结果输出的核心编排；PowerContext 保存并复用每位玩家的往期梗，seekdb 作为 Dify 部署时的元数据库与记忆持久化存储。记忆快照随交付材料提供，导入 DSL 后即可运行，主流程不依赖任何不可达的外部服务。
  icon: "🎤"
  icon_background: '#FFEAD5'
  mode: workflow
  name: 办公室离谱辩论会
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: 给我一个日常辩题，再贴上这位玩家的往期记忆，我来主持一场一本正经的离谱辩论。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
      - 午休该不该关灯
      - 群里回收到算不算已读
      - 会议室的椅子有没有领地意识
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - data: {isInIteration: false, sourceType: start, targetType: llm}
        id: e-start-host
        source: start_node
        sourceHandle: source
        target: host_llm
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, sourceType: llm, targetType: end}
        id: e-host-end
        source: host_llm
        sourceHandle: source
        target: end_node
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: 辩题、玩家名、立场，以及从 PowerContext 导出的往期记忆快照；seekdb 负责这些记忆的持久化与按玩家检索。
          selected: false
          title: 开始
          type: start
          variables:
            - label: 玩家昵称
              max_length: 48
              options: []
              required: true
              type: text-input
              variable: player
            - label: 今日辩题
              max_length: 200
              options: []
              required: true
              type: text-input
              variable: topic
            - label: 我站哪边
              max_length: 48
              options: []
              required: false
              type: text-input
              variable: stance
            - label: 往期记忆（PowerContext 导出）
              max_length: 2000
              options: []
              required: false
              type: text-input
              variable: memory_context
        height: 200
        id: start_node
        position: {x: 80, y: 240}
        positionAbsolute: {x: 80, y: 240}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context: {enabled: false, variable_selector: []}
          desc: Dify LLM 节点读取往期记忆并生成主持人串词与本轮新梗，新梗写回 PowerContext 后供跨会话复用。
          model:
            completion_params: {temperature: 0.85, max_tokens: 700}
            mode: chat
            name: gpt-4o-mini
            provider: langgenius/openai/openai
          prompt_template:
            - id: sys-1
              role: system
              text: "你是「办公室离谱辩论会」的主持人。风格：一本正经地胡说八道，但不人身攻击、不编造真实人名机构。PowerContext 保存的往期记忆由开始节点传入，seekdb 负责这些记忆的持久化。严格按下面三段输出，不要加标题以外的其他段落：【本轮串词】含开场、正方一句、反方一句、主持人收束，共 4 到 6 句；【本轮新梗】一行，20 字以内；【记忆写回】一行，给出建议写回 PowerContext 的键值对。如果往期记忆里出现过这位玩家的旧梗，必须在串词里自然接上一次，并点明上次说过什么。"
            - id: usr-1
              role: user
              text: "玩家：{{#start_node.player#}}\n今日辩题：{{#start_node.topic#}}\n立场：{{#start_node.stance#}}\nPowerContext 往期记忆：{{#start_node.memory_context#}}"
          selected: false
          title: 主持人串词
          type: llm
          variables: []
          vision: {enabled: false}
        height: 92
        id: host_llm
        position: {x: 420, y: 240}
        positionAbsolute: {x: 420, y: 240}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: 输出主持人串词与本轮新梗，按验证样例把新梗写回 PowerContext，下一轮由 seekdb 检索后再注入 memory_context。
          outputs:
            - value_selector: [host_llm, text]
              variable: speech
          selected: false
          title: 结束
          type: end
        height: 92
        id: end_node
        position: {x: 760, y: 240}
        positionAbsolute: {x: 760, y: 240}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    viewport: {x: 0, y: 0, zoom: 0.8}
