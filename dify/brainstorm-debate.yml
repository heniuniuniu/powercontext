app:
  description: Dify Workflow 应用。输入一个日常离谱辩题，AI 主持人结合 PowerContext 里记住的往期梗和人物设定串场，并把本轮新梗写回 PowerContext 记忆，下次接着聊。记忆的持久化检索由 PowerContext 提供，部署时也可改用 seekdb 作为 Dify 的应用数据库。
  icon: "\U0001F3A4"
  icon_background: '#FFEAD5'
  mode: workflow
  name: 办公室离谱辩论会
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables:
    - name: PC_BRIDGE_URL
      type: string
      value: http://host.docker.internal:8765
  features:
    file_upload:
      enabled: false
    opening_statement: 给我一个日常辩题，我来主持一场一本正经的离谱辩论。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
      - 午休该不该关灯
      - 群里回「收到」算不算已读
      - 会议室的椅子有没有领地意识
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - data: {isInIteration: false, sourceType: start, targetType: http-request}
        id: e-start-read
        source: start_node
        sourceHandle: source
        target: read_memory
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, sourceType: http-request, targetType: llm}
        id: e-read-llm
        source: read_memory
        sourceHandle: source
        target: host_llm
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, sourceType: llm, targetType: http-request}
        id: e-llm-write
        source: host_llm
        sourceHandle: source
        target: write_memory
        targetHandle: target
        type: custom
        zIndex: 0
      - data: {isInIteration: false, sourceType: http-request, targetType: end}
        id: e-write-end
        source: write_memory
        sourceHandle: source
        target: end_node
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: 辩题、玩家名与立场
          selected: false
          title: 开始
          type: start
          variables:
            - label: 玩家昵称
              max_length: 48
              options: []
              required: true
              type: text-input
              variable: player
            - label: 今日辩题
              max_length: 200
              options: []
              required: true
              type: text-input
              variable: topic
            - label: 我站哪边
              max_length: 48
              options: []
              required: false
              type: text-input
              variable: stance
        height: 160
        id: start_node
        position: {x: 60, y: 240}
        positionAbsolute: {x: 60, y: 240}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          authorization: {config: null, type: no-auth}
          body:
            data: []
            type: none
          desc: 从 PowerContext 取回这位玩家往期的梗
          headers: ''
          method: get
          params:
            - id: p-player
              key: player
              type: text
              value: '{{#start_node.player#}}'
          selected: false
          timeout: {max_connect_timeout: 0, max_read_timeout: 0, max_write_timeout: 0}
          title: 读取往期记忆
          type: http-request
          url: '{{#env.PC_BRIDGE_URL#}}/memory/read'
          variables: []
        height: 92
        id: read_memory
        position: {x: 360, y: 240}
        positionAbsolute: {x: 360, y: 240}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          context: {enabled: false, variable_selector: []}
          desc: 主持人串场，输出固定两段结构
          model:
            completion_params: {temperature: 0.85, max_tokens: 700}
            mode: chat
            name: gpt-4o-mini
            provider: langgenius/openai/openai
          prompt_template:
            - id: sys-1
              role: system
              text: "你是「办公室离谱辩论会」的主持人。风格：一本正经地胡说八道，但不人身攻击、不编造真实人名机构。\n严格按下面两段输出，不要加标题以外的其他段落：\n【本轮串词】\n（含开场、正方一句、反方一句、主持人收束，共 4~6 句）\n【本轮新梗】\n（一行，20 字以内，供下轮复用）\n如果往期记忆里出现过这位玩家的旧梗，必须在串词里自然接上一次，并点明「上次你说过…」。"
            - id: usr-1
              role: user
              text: "玩家：{{#start_node.player#}}\n今日辩题：{{#start_node.topic#}}\n立场：{{#start_node.stance#}}\n往期记忆：{{#read_memory.body#}}"
          selected: false
          title: 主持人串词
          type: llm
          variables: []
          vision: {enabled: false}
        height: 92
        id: host_llm
        position: {x: 660, y: 240}
        positionAbsolute: {x: 660, y: 240}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          authorization: {config: null, type: no-auth}
          body:
            data:
              - id: b-player
                key: player
                type: text
                value: '{{#start_node.player#}}'
              - id: b-topic
                key: topic
                type: text
                value: '{{#start_node.topic#}}'
              - id: b-content
                key: content
                type: text
                value: '{{#host_llm.text#}}'
            type: json
          desc: 把本轮串词与新梗写回 PowerContext
          headers: 'Content-Type: application/json'
          method: post
          params: []
          selected: false
          timeout: {max_connect_timeout: 0, max_read_timeout: 0, max_write_timeout: 0}
          title: 写回记忆
          type: http-request
          url: '{{#env.PC_BRIDGE_URL#}}/memory/write'
          variables: []
        height: 92
        id: write_memory
        position: {x: 960, y: 240}
        positionAbsolute: {x: 960, y: 240}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: ''
          outputs:
            - value_selector: [host_llm, text]
              variable: speech
          selected: false
          title: 结束
          type: end
        height: 92
        id: end_node
        position: {x: 1260, y: 240}
        positionAbsolute: {x: 1260, y: 240}
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    viewport: {x: 0, y: 0, zoom: 0.8}
